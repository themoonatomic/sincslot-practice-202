title = "SincSlot Gitleaks custom rules"

[allowlist]
description = "Allow test and documentation placeholders"
paths = [
    '''README.md''',
    '''documentation/.*''',
    '''.*example.*''',
    '''.*sample.*'''
]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "secret"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)["'\s:=]+["']?[A-Za-z0-9]{20,}["']?'''
tags = ["generic", "secret"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["crypto", "secret"]

[[rules]]
id = "password-in-code"
description = "Hardcoded password"
regex = '''(?i)(password|passwd|pwd)\s*=\s*["'][^"']{4,}["']'''
tags = ["password", "secret"]

[[rules]]
id = "database-url-with-password"
description = "Database URL with password"
regex = '''(?i)(postgresql|mysql|mongodb|redis):\/\/[^:\s]+:[^@\s]+@[^\/\s]+'''
tags = ["database", "secret"]