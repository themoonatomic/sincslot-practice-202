name: Fast Feedback CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - practice-202-ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Black check
        run: black --check backend/main.py

      - name: Run Flake8
        run: flake8 backend/main.py --max-line-length=120 --extend-ignore=E203,W503

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check test files exist
        run: |
          test -d backend/tests
          find backend/tests -name "test_*.py" | head -n 3

      - name: Test stage
        run: |
          echo "Backend tests exist in the project."
          echo "Full pytest execution requires configured test database and environment variables."

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets

      - name: Run Bandit
        run: bandit -r backend -x backend/tests,backend/alembic -s B105

      - name: Run detect-secrets
        run: detect-secrets scan --baseline .secrets.baseline