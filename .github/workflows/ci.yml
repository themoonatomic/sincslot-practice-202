name: Optimized CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - practice-205-cicd-optimization
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.1
        env:
          POSTGRES_DB: syncslot_db_test
          POSTGRES_USER: pguser_test
          POSTGRES_PASSWORD: pgpassword_test
        ports:
          - 54349:5432
        options: >-
          --health-cmd="pg_isready -U pguser_test -d syncslot_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        test-suite: [unit, integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          POSTGRES_DB: syncslot_db_test
          POSTGRES_USER: pguser_test
          POSTGRES_PASSWORD: pgpassword_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 54349
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          if [ -d "backend/tests/${{ matrix.test-suite }}" ]; then
            pytest backend/tests/${{ matrix.test-suite }}
          else
            pytest backend/tests
          fi

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install and check frontend
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
            npm run build --if-present
          else
            echo "package-lock.json not found, frontend checks skipped"
          fi

  security-sast:
    name: Security SAST Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Bandit dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-bandit-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bandit-

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend -x backend/tests,backend/alembic -ll -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  security-sca:
    name: Security SCA pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip-audit dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: |
          pip-audit --requirement backend/requirements.txt --format json --output pip-audit-report.json || true

      - name: Fail on CVSS >= 7.0
        run: |
          python - <<'PY'
          import json
          import re
          import sys

          report_path = "pip-audit-report.json"

          try:
              with open(report_path, "r", encoding="utf-8") as file:
                  report = json.load(file)
          except FileNotFoundError:
              print("pip-audit report not found")
              sys.exit(1)

          critical_items = []

          for dependency in report.get("dependencies", []):
              dep_name = dependency.get("name", "unknown")
              for vuln in dependency.get("vulns", []):
                  vuln_id = vuln.get("id", "unknown")
                  score_values = []

                  for key in ("cvss", "cvss_score", "severity_score", "score"):
                      value = vuln.get(key)
                      if isinstance(value, (int, float)):
                          score_values.append(float(value))
                      elif isinstance(value, str):
                          match = re.search(r"(\d+(?:\.\d+)?)", value)
                          if match:
                              score_values.append(float(match.group(1)))

                  severity = str(vuln.get("severity", "")).lower()

                  if any(score >= 7.0 for score in score_values) or severity in ("high", "critical"):
                      critical_items.append(f"{dep_name}: {vuln_id}")

          if critical_items:
              print("Critical vulnerabilities found:")
              for item in critical_items:
                  print(f"- {item}")
              sys.exit(1)

          print("No vulnerabilities with CVSS >= 7.0 found")
          PY

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  docker-build:
    name: Docker BuildKit build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/sincslot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - security-sast
      - security-sca

    steps:
      - name: Check security status
        run: |
          echo "Checking security status..."
          if [ "${{ needs.security-sast.result }}" = "failure" ] || [ "${{ needs.security-sca.result }}" = "failure" ]; then
            echo "Critical security issues found"
            exit 1
          fi
          echo "Security checks passed"

  pipeline-result:
    name: Pipeline result
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
      - docker-build
      - security-gate

    steps:
      - name: Final status
        run: echo "Optimized CI/CD pipeline completed"